[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leanelpi"
version = "0.3.0"
description = "Python bindings for LeanElpi, the ELPI dialect of λProlog implemented in Lean 4"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["lambda-prolog", "elpi", "logic-programming", "lean4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Prolog",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://volland.github.io/lean-elpi/"
Source = "https://github.com/Volland/lean-elpi"

[tool.setuptools]
packages = ["leanelpi"]

[tool.setuptools.package-data]
leanelpi = ["lib*.dylib", "lib*.so", "lib*.so.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
