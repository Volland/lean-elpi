# Builds the native library on each platform, tests the three bindings against it, and on a
# version tag publishes to PyPI (trusted publishing), npm and crates.io.
# Run it by hand ("Run workflow") for a dry run: everything builds, nothing is published.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,        wheel_plat: macosx_11_0_arm64,        name: darwin-arm64 }
          - { os: macos-15-intel,  wheel_plat: macosx_11_0_x86_64,       name: darwin-x64 }
          - { os: ubuntu-22.04,    wheel_plat: manylinux_2_35_x86_64,    name: linux-x64 }
          - { os: ubuntu-22.04-arm, wheel_plat: manylinux_2_35_aarch64,  name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Versions agree and match the tag
        run: |
          scripts/check-versions.sh
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            want="v$(sed -n 's/.*version := v!"\([^"]*\)".*/\1/p' lakefile.lean | head -1)"
            [ "${GITHUB_REF_NAME}" = "$want" ] || { echo "tag ${GITHUB_REF_NAME} != $want" >&2; exit 1; }
          fi
      - name: Build the library
        run: scripts/build-ffi.sh
      - name: Library depends only on system libraries
        run: scripts/check-ffi-deps.sh
      - name: Test the bindings against it
        run: |
          python -m pip install pytest build twine
          (cd bindings/python && python -m pytest)
          (cd bindings/node && npm install && npm test)
          (cd bindings/rust && cargo test)
      - name: Package
        env:
          LEANELPI_WHEEL_PLAT: ${{ matrix.wheel_plat }}
        run: |
          scripts/package-python.sh
          scripts/package-node.sh
          tar -C dist -czf dist/libleanelpi-${{ matrix.name }}.tar.gz $(cd dist && ls lib* leanelpi.h)
      - name: Packages are publishable
        run: scripts/verify-distribution.sh
      - name: Smoke test the packages in clean environments
        run: |
          cd "$RUNNER_TEMP"
          python -m venv v && ./v/bin/pip install "$GITHUB_WORKSPACE"/dist/wheels/*.whl
          ./v/bin/python -I -c "import leanelpi; print(leanelpi.Program('pred n o:int.\nn 1.').first('n X'))"
          mkdir n && cd n && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/dist/npm/lean-elpi-leanelpi-${{ matrix.name }}-*.tgz "$GITHUB_WORKSPACE"/dist/npm/lean-elpi-leanelpi-0*.tgz
          node -e "const {Program}=require('@lean-elpi/leanelpi'); console.log(new Program('pred n o:int.\nn 1.').first('n X'))"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/wheels/*.whl
            dist/npm/*.tgz
            dist/libleanelpi-*.tar.gz

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: mkdir upload && find artifacts -name '*.whl' -exec cp {} upload/ \;
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: upload }

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write          # provenance
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish platform packages, then the loader
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tgz=$(find artifacts -name 'lean-elpi-leanelpi-*.tgz')
          for f in $(echo "$tgz" | grep -E 'leanelpi-(darwin|linux)-'); do npm publish "$f" --access public --provenance; done
          for f in $(echo "$tgz" | grep -Ev 'leanelpi-(darwin|linux)-'); do npm publish "$f" --access public --provenance; done

  publish-crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: linux-x64, path: artifacts }
      - name: Publish (verification links against the Linux library)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          mkdir lib && tar -xzf "$(find artifacts -name 'libleanelpi-linux-x64.tar.gz')" -C lib
          cd bindings/rust && LEANELPI_DIST="$GITHUB_WORKSPACE/lib" cargo publish

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-pypi, publish-npm, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/libleanelpi-*.tar.gz
