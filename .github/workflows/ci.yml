name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the ELPI 1.18 oracle
        run: |
          sudo apt-get update && sudo apt-get install -y opam
          opam init --yes --disable-sandboxing
          scripts/install-oracle.sh
      - name: Build
        run: lake build
      - name: Core must not import Lean.Meta / Lean.Elab
        run: scripts/check-core-imports.sh
      - name: Tests
        # the conformance self-test runs the real ELPI, so the oracle's opam switch must be active
        run: |
          eval "$(opam env --switch=lean-elpi-oracle)"
          nproc; free -m; df -h / | tail -1
          # log memory while the tests run, so a runner that kills the step leaves a trace
          (while true; do echo "mem: $(free -m | awk 'NR==2{print "used="$3"M free="$4"M avail="$7"M"}') procs=$(pgrep -c lean || true)"; sleep 5; done) &
          lake test
      - name: Bindings (C library, Python, Node.js, Rust)
        run: |
          scripts/check-versions.sh
          scripts/build-ffi.sh
          scripts/check-ffi-deps.sh
          python3 -m pip install pytest
          (cd bindings/python && python3 -m pytest)
          (cd bindings/node && npm install && npm test)
          (cd bindings/rust && cargo test)
      - name: Differential conformance against the oracle
        run: |
          eval "$(opam env --switch=lean-elpi-oracle)"
          lake run conformance
